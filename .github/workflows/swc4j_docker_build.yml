name: swc4j Docker Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &docker_build_paths
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.github/workflows/**"
      - ".github/workflows/swc4j_docker_build.yml"
  push:
    branches:
      - main
    paths: *docker_build_paths

permissions:
  contents: read

jobs:
  build_linux:
    name: Ubuntu 20.04 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Build the library and run the Rust and Gradle tests
        run: |
          docker buildx build --platform "$PLATFORM" --target tested-library \
            --output "type=local,dest=$RUNNER_TEMP/tested-library" -f docker/Dockerfile .
          cp "$RUNNER_TEMP"/tested-library/*.so src/main/resources/

      - name: Upload the Linux shared library
        uses: actions/upload-artifact@v6
        with:
          name: swc4j-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/tested-library/libswc4j-linux-${{ matrix.arch }}.v.*.so
          if-no-files-found: error
